{% extends "base.html" %}

{% block title %}Login — {{ app_name }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-md space-y-6">
  <div class="space-y-2">
    <h1 class="text-3xl font-bold text-slate-900">Sign in</h1>
    <p class="text-sm text-slate-600">Use your demo Samadhan account. Seeded users arrive in T-016.</p>
  </div>

  {% if error_message %}
  <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
    {{ error_message }}
  </div>
  {% endif %}

  <form method="post" action="/login" class="space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      >
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      >
    </div>
    <button
      type="submit"
      class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-800"
    >
      Sign in
    </button>
  </form>
</section>
{% endblock %}
